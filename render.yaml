services:
  - type: web
    name: nefitly-otp-web
    runtime: python
    rootDir: otp
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash run_otp_web.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OTP_WEB_HOST
        value: 0.0.0.0
      - key: OTP_WEB_REQUIRE_KEY
        value: "1"
      - key: OTP_WEB_SESSION_TTL_SECONDS
        value: "1800"
      - key: OTP_WEB_ALLOWED_TIME_WINDOW
        value: "07:00-23:30"
      - key: OTP_WEB_TRUST_PROXY
        value: "1"
      - key: OTP_WEB_SHEET_REFRESH_SECONDS
        value: "15"
      - key: OTP_WEB_API_KEY
        sync: false
      - key: OTP_WEB_SESSION_SIGNING_KEY
        sync: false
      - key: OTP_WEB_USERS
        sync: false
      - key: OTP_WEB_ALLOWED_IPS
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_GID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OTP_WEB_WPS_FILE
        value: /opt/render/project/src/otp_wps.csv
      - key: OTP_WEB_AUDIT_LOG
        value: /opt/render/project/src/.runtime/otp_web_access.log
